name = "formal_research"
version = "0.1.0"
defaultTargets = ["FormalResearch", "QVCheckImpl"]

[[lean_lib]]
name = "FormalResearch"

# Mathlib-free computational checker of the QV certificate; precompiled so that `native_decide` runs native code.
[[lean_lib]]
name = "QVCheckImpl"
globs = ["QVCheckImpl", "QVCheckImpl.+"]
precompileModules = true

# Vendored third-party proof of the 2 x 3 PPT criterion (see ThirdParty/math-lab/NOTICE.md); built via imports.
[[lean_lib]]
name = "MathLab"
srcDir = "ThirdParty/math-lab"
globs = ["MathLab.+"]

[[lean_lib]]
name = "ThreeCopyQutritWerner"
srcDir = "ThirdParty/math-lab/ThirdParty/PSI"
globs = ["ThreeCopyQutritWerner.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

name = "formal_research"
version = "0.1.0"
defaultTargets = ["FormalResearch", "QVCheckImpl"]

[[lean_lib]]
name = "FormalResearch"

# Mathlib-free computational checker of the QV certificate; precompiled so that `native_decide` runs native code.
[[lean_lib]]
name = "QVCheckImpl"
globs = ["QVCheckImpl", "QVCheckImpl.+"]
precompileModules = true

# Vendored third-party proof of the 2 x 3 PPT criterion (see ThirdParty/math-lab/NOTICE.md); built via imports.
[[lean_lib]]
name = "MathLab"
srcDir = "ThirdParty/math-lab"
globs = ["MathLab.+"]

# Vendored Euler-Maclaurin formula and Stirling series for log Gamma from girving/interval (see ThirdParty/interval/NOTICE.md).
[[lean_lib]]
name = "Interval"
srcDir = "ThirdParty/interval"
globs = ["Interval.EulerMaclaurin.+"]
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

# Pfaff-Saalschutz and Sears summations (Mathlib-only part of the Physlib Racah stack; see ThirdParty/physlib-racah/NOTICE.md). Optional: not a default target.
[[lean_lib]]
name = "PhyslibRacahHyp"
srcDir = "ThirdParty/physlib-racah"
globs = ["PhyslibAlpha.Mathematics.SpecialFunctions.Hypergeometric.+"]

[[lean_lib]]
name = "ThreeCopyQutritWerner"
srcDir = "ThirdParty/math-lab/ThirdParty/PSI"
globs = ["ThreeCopyQutritWerner.+"]

# Vendored import closures of bjbraams/lean-DLMF (Apache-2.0; see ThirdParty/lean-dlmf/NOTICE.md). Optional: not a default target.
[[lean_lib]]
name = "DLMFMathlib"
srcDir = "ThirdParty/lean-dlmf"
globs = ["DLMFMathlib.+"]
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

# Import closure of DLMF.Confluent.Regularized (with the parabolic-cylinder modules) and the lean-codes / TauCeti
# modules it needs (ComplexAnalysis.HalfPlane, ComplexAnalysis.Pow, TauCeti.Analysis.Complex.SlitPlane,
# TauCeti.Analysis.SpecialFunctions.Erf). Explicit modules only; see ThirdParty/lean-dlmf/NOTICE.md.
[[lean_lib]]
name = "DLMF"
srcDir = "ThirdParty/lean-dlmf"
globs = ["ComplexAnalysis.HalfPlane", "ComplexAnalysis.Pow", "DLMF.Confluent.Basic", "DLMF.Confluent.Basic.Buchholz", "DLMF.Confluent.Basic.ErrorFunctions", "DLMF.Confluent.Basic.ExpansionData", "DLMF.Confluent.Basic.ExponentialIntegralSeries", "DLMF.Confluent.Basic.ExponentialIntegrals", "DLMF.Confluent.Basic.IncompleteGamma", "DLMF.Confluent.Basic.KummerContiguous", "DLMF.Confluent.Basic.KummerM", "DLMF.Confluent.Basic.KummerProperties", "DLMF.Confluent.Basic.Tricomi", "DLMF.Confluent.Basic.TricomiLogarithmic", "DLMF.Confluent.Basic.Whittaker", "DLMF.Confluent.Basic.WhittakerLogarithmic", "DLMF.Confluent.KummerProperties", "DLMF.Confluent.ParabolicCylinder.WronskiansAndConnections", "DLMF.Confluent.Regularized", "DLMF.Core.Basic", "DLMF.ErrorFunctions.Basic.Functions", "DLMF.ErrorFunctions.Basic.Properties", "DLMF.Hypergeometric.Basic.AppellF4", "DLMF.Hypergeometric.Basic.CutPlane", "DLMF.Hypergeometric.Basic.GaussCoefficients", "DLMF.Hypergeometric.Basic.GaussEquation", "DLMF.Hypergeometric.Basic.GaussSeries", "DLMF.Hypergeometric.Basic.ParameterAnalyticity", "DLMF.Hypergeometric.Basic.Pochhammer", "DLMF.Hypergeometric.Basic.PrincipalBranch", "DLMF.Hypergeometric.Basic.RealPochhammer", "DLMF.Hypergeometric.Basic.SpecialValues", "DLMF.Hypergeometric.Contiguous", "DLMF.Hypergeometric.Continuation", "DLMF.Hypergeometric.Derivatives", "DLMF.Hypergeometric.DiffEq", "DLMF.Hypergeometric.EulerIntegral", "DLMF.Hypergeometric.Transformations", "DLMF.ParabolicCylinder.Basic.Functions", "DLMF.ParabolicCylinder.Basic.WeberEquation", "DLMF.ParabolicCylinder.Basic.Wronskians", "DLMF.ParabolicCylinder.ElementaryPropertiesCore", "TauCeti.Analysis.Complex.SlitPlane", "TauCeti.Analysis.SpecialFunctions.Erf"]
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

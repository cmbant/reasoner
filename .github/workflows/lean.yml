name: Lean verification

# Builds named targets only: the full `lake build` recompiles every paper (about an hour) and is not run in CI.
# Example targets: `FormalResearch.PPTThreeQubit` (a paper's aggregate module) or individual modules.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated Lake targets to build (e.g. FormalResearch.PPTThreeQubit)
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Build the requested targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: lake build $TARGETS

name: Lean QI-D nested upper atomic core

on:
  push:
    branches: [agents/qid-nested-upper-decomposition]
  workflow_dispatch:

jobs:
  qid-nested-upper-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Build nested upper atomic core
        run: timeout 1200 lake build FormalResearch.QID.NestedUpperAtomicCore
      - name: Build explicit rank-one sums
        run: timeout 1200 lake build FormalResearch.QID.NestedUpperRankOneSums
      - name: Build conditional support bridge
        run: timeout 1200 lake build FormalResearch.QID.NestedUpperSupportBridge
      - name: Build full FormalResearch aggregate
        run: timeout 1200 lake build FormalResearch

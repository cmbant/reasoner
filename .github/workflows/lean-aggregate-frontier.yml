name: Lean aggregate frontier blockers

on:
  push:
    branches:
      - formal-research-lean
      - 'agents/**'

concurrency:
  group: lean-aggregate-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-next:
    if: ${{ contains(github.event.head_commit.message, '[aggregate-next]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Rewrite QI-D inverse certificates entrywise
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cases = [
            (
              Path('FormalResearch/QID/D5AffineRank.lean'),
              'D5Affine24_mod3_right_inverse',
              'D5Affine24_mod3_left_inverse',
              'D5Affine24_mod3_right_inverse',
            ),
            (
              Path('FormalResearch/QID/D5ActiveAffineCertificate.lean'),
              'selectedD5Diff24_right_inverse',
              'selectedD5Diff24_left_inverse',
              'selectedD5Diff24_right_inverse',
            ),
          ]

          for path, right_name, left_name, right_ref in cases:
              s = path.read_text()
              right_pat = rf'(theorem {right_name} :\n(?:    .*\n)+?    .* := by)\n  native_decide'
              s, n1 = re.subn(
                  right_pat,
                  rf'\1\n  ext i j\n  fin_cases i <;> fin_cases j <;> decide',
                  s,
                  count=1,
              )
              left_pat = rf'(theorem {left_name} :\n(?:    .*\n)+?    .* := by)\n  native_decide'
              s, n2 = re.subn(
                  left_pat,
                  rf'\1\n  rw [mul_eq_one_comm]\n  exact {right_ref}',
                  s,
                  count=1,
              )
              assert (n1, n2) == (1, 1), (path, n1, n2)
              path.write_text(s)
          PY
      - name: QI-D downstream certificate chain
        run: >-
          timeout 900 lake build
          FormalResearch.QID.D5AffineRank
          FormalResearch.QID.D5ActiveAffineCertificate
          FormalResearch.QID.D5FacetCertificate
          FormalResearch.QID.D5CharacteristicZeroCertificate
          FormalResearch.QID.D5AffineIndependence
          FormalResearch.QID.D5SupportingFacet
          FormalResearch.QID.D5FullFacetCertificate

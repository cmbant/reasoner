name: Lean aggregate frontier blockers

on:
  push:
    branches:
      - formal-research-lean
      - 'agents/**'

concurrency:
  group: lean-aggregate-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-next:
    if: ${{ contains(github.event.head_commit.message, '[aggregate-next]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Rewrite affine certificate proof entrywise with kernel decide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FormalResearch/QID/D5AffineRank.lean')
          s = p.read_text()
          old = '''theorem D5Affine24_mod3_right_inverse :
              D5Affine24Mod3 * D5Affine24InvMod3 = 1 := by
            native_decide

          theorem D5Affine24_mod3_left_inverse :
              D5Affine24InvMod3 * D5Affine24Mod3 = 1 := by
            native_decide'''
          new = '''theorem D5Affine24_mod3_right_inverse :
              D5Affine24Mod3 * D5Affine24InvMod3 = 1 := by
            ext i j
            fin_cases i <;> fin_cases j <;> decide

          theorem D5Affine24_mod3_left_inverse :
              D5Affine24InvMod3 * D5Affine24Mod3 = 1 := by
            rw [mul_eq_one_comm]
            exact D5Affine24_mod3_right_inverse'''
          assert old in s
          p.write_text(s.replace(old, new))
          PY
      - name: QI-D affine-rank entrywise kernel certificate
        run: timeout 900 lake build FormalResearch.QID.D5AffineRank

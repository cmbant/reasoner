name: Lean aggregate frontier blockers

on:
  push:
    branches:
      - formal-research-lean
      - 'agents/**'

concurrency:
  group: lean-aggregate-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-next:
    if: ${{ contains(github.event.head_commit.message, '[aggregate-next]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Rewrite QI-D finite certificates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_native_proof(text, theorem_name, body):
              marker = f"theorem {theorem_name} :"
              start = text.index(marker)
              suffix = " := by\n  native_decide"
              proof = text.index(suffix, start)
              next_theorem = text.find("\ntheorem ", start + len(marker))
              if next_theorem != -1:
                  assert proof < next_theorem, theorem_name
              return text[:proof] + " := by\n" + body + text[proof + len(suffix):]

          p = Path('FormalResearch/QID/D5AffineRank.lean')
          s = p.read_text()
          s = replace_native_proof(
              s,
              'D5Affine24_mod3_right_inverse',
              "  ext i j\n  fin_cases i <;> fin_cases j <;> decide",
          )
          s = replace_native_proof(
              s,
              'D5Affine24_mod3_left_inverse',
              "  rw [mul_eq_one_comm]\n  exact D5Affine24_mod3_right_inverse",
          )
          p.write_text(s)

          p = Path('FormalResearch/QID/D5ActiveAffineCertificate.lean')
          s = p.read_text()
          s = replace_native_proof(
              s,
              'selectedD5_all_active',
              "  letI : DecidablePred (fun k : Fin25V => selectedD5Valid k ∧ selectedD5Score k = 5) := fun k => by\n    unfold selectedD5Valid\n    letI : Decidable (∀ i : Fin5V, selectedD5Signs k i = 1 ∨ selectedD5Signs k i = -1) :=\n      Fintype.decidableForallFintype\n    infer_instance\n  letI : Decidable (∀ k : Fin25V, selectedD5Valid k ∧ selectedD5Score k = 5) :=\n    Fintype.decidableForallFintype\n  decide",
          )
          s = replace_native_proof(
              s,
              'selectedD5Diff24_right_inverse',
              "  ext i j\n  fin_cases i <;> fin_cases j <;> decide",
          )
          s = replace_native_proof(
              s,
              'selectedD5Diff24_left_inverse',
              "  rw [mul_eq_one_comm]\n  exact selectedD5Diff24_right_inverse",
          )
          p.write_text(s)

          p = Path('FormalResearch/QID/D5CharacteristicZeroCertificate.lean')
          s = p.read_text()
          s = s.replace(
              '  simpa [selectedD5Diff24Mod3, Matrix.mapMatrix_apply] using hmap',
              '  have hmatrix :\n      (Int.castRingHom (ZMod 3)).mapMatrix selectedD5Diff24 = selectedD5Diff24Mod3 := by\n    ext i j\n    rfl\n  rw [← hmatrix]\n  exact hmap',
          )
          s = s.replace(
              '  simpa [selectedD5Diff24Q, ← RingHom.map_det] using hcast',
              '  rw [selectedD5Diff24Q, ← RingHom.map_det]\n  exact hcast',
          )
          p.write_text(s)

          p = Path('FormalResearch/QID/D5AffineIndependence.lean')
          s = p.read_text()
          old = "  rw [affineIndependent_iff_linearIndependent_vsub ℚ selectedD5ProjectedQ\n    (0 : Fin25V)]\n  rw [← linearIndependent_equiv (finSuccAboveEquiv (0 : Fin25V))]\n  simpa [Function.comp_def, Fin.zero_succAbove,\n    selectedD5ProjectedQ_succ_sub_zero] using\n      selectedD5Diff24Q_cols_linearIndependent"
          new = "  rw [affineIndependent_iff_linearIndependent_vsub ℚ selectedD5ProjectedQ\n    (0 : Fin25V)]\n  rw [← linearIndependent_equiv (finSuccAboveEquiv (0 : Fin25V))]\n  convert! selectedD5Diff24Q_cols_linearIndependent\n  ext j\n  rw [finSuccAboveEquiv_apply]\n  simpa only [Fin.zero_succAbove] using\n    selectedD5ProjectedQ_succ_sub_zero j"
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('FormalResearch/QID/D5SupportingFacet.lean')
          s = p.read_text()
          old = "theorem D5_support_upper (ps : SignedPerm5) (hps : ps ∈ allD5) :\n    signedPermutationScore ps.1 ps.2 ≤ 5 := by\n  native_decide"
          new = "theorem D5_support_upper (ps : SignedPerm5) (hps : ps ∈ allD5) :\n    signedPermutationScore ps.1 ps.2 ≤ 5 := by\n  native_decide +revert"
          assert old in s
          p.write_text(s.replace(old, new))
          PY
      - name: QI-D downstream certificate chain
        run: >-
          timeout 900 lake build
          FormalResearch.QID.D5AffineRank
          FormalResearch.QID.D5ActiveAffineCertificate
          FormalResearch.QID.D5FacetCertificate
          FormalResearch.QID.D5CharacteristicZeroCertificate
          FormalResearch.QID.D5AffineIndependence
          FormalResearch.QID.D5SupportingFacet
          FormalResearch.QID.D5FullFacetCertificate

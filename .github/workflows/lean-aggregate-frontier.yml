name: Lean aggregate frontier blockers

on:
  push:
    branches:
      - formal-research-lean
      - 'agents/**'

concurrency:
  group: lean-aggregate-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-next:
    if: ${{ contains(github.event.head_commit.message, '[aggregate-next]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Rewrite QI-D inverse certificates entrywise
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'FormalResearch/QID/D5AffineRank.lean': (
              '''theorem D5Affine24_mod3_right_inverse :
                  D5Affine24Mod3 * D5Affine24InvMod3 = 1 := by
                native_decide

              theorem D5Affine24_mod3_left_inverse :
                  D5Affine24InvMod3 * D5Affine24Mod3 = 1 := by
                native_decide''',
              '''theorem D5Affine24_mod3_right_inverse :
                  D5Affine24Mod3 * D5Affine24InvMod3 = 1 := by
                ext i j
                fin_cases i <;> fin_cases j <;> decide

              theorem D5Affine24_mod3_left_inverse :
                  D5Affine24InvMod3 * D5Affine24Mod3 = 1 := by
                rw [mul_eq_one_comm]
                exact D5Affine24_mod3_right_inverse'''),
            'FormalResearch/QID/D5ActiveAffineCertificate.lean': (
              '''theorem selectedD5Diff24_right_inverse :
                  selectedD5Diff24Mod3 * selectedD5Diff24InvMod3 = 1 := by
                native_decide

              theorem selectedD5Diff24_left_inverse :
                  selectedD5Diff24InvMod3 * selectedD5Diff24Mod3 = 1 := by
                native_decide''',
              '''theorem selectedD5Diff24_right_inverse :
                  selectedD5Diff24Mod3 * selectedD5Diff24InvMod3 = 1 := by
                ext i j
                fin_cases i <;> fin_cases j <;> decide

              theorem selectedD5Diff24_left_inverse :
                  selectedD5Diff24InvMod3 * selectedD5Diff24Mod3 = 1 := by
                rw [mul_eq_one_comm]
                exact selectedD5Diff24_right_inverse''')
          }
          for filename, (old, new) in replacements.items():
              p = Path(filename)
              s = p.read_text()
              assert old in s, filename
              p.write_text(s.replace(old, new))
          PY
      - name: QI-D downstream certificate chain
        run: >-
          timeout 900 lake build
          FormalResearch.QID.D5AffineRank
          FormalResearch.QID.D5ActiveAffineCertificate
          FormalResearch.QID.D5FacetCertificate
          FormalResearch.QID.D5CharacteristicZeroCertificate
          FormalResearch.QID.D5AffineIndependence
          FormalResearch.QID.D5SupportingFacet
          FormalResearch.QID.D5FullFacetCertificate

name: Lean frontier diagnostics

on:
  push:
    branches: [formal-research-lean]
  workflow_dispatch:

jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: AUX-BV quartic charge-gap module build
        run: timeout 300 lake build FormalResearch.Blaschke.QuarticChargeGapAlgebra
      - name: FormalResearch aggregate build
        run: timeout 600 lake build FormalResearch
      - name: QI-A explicit printed spectrum diagnostic
        continue-on-error: true
        run: timeout 150 lake env lean FormalResearch/QIA/PrintedChiralitySpectrum.lean
      - name: QI-B2 exact Hamming spectral phase diagnostic
        continue-on-error: true
        run: timeout 150 lake env lean FormalResearch/QIB2/HammingSpectralPhase.lean
      - name: QI-B2 Krawtchouk coefficient diagnostic
        continue-on-error: true
        run: timeout 150 lake env lean FormalResearch/QIB2/KrawtchoukEigenvalue.lean
      - name: QI-C symbolic endpoint identity diagnostic
        continue-on-error: true
        run: timeout 210 lake env lean FormalResearch/QIC/Endpoint14PolynomialIdentity.lean
      - name: QI-C Gaussian endpoint nonsingularity diagnostic
        continue-on-error: true
        run: timeout 210 lake env lean FormalResearch/QIC/GaussianEndpointNonsingular.lean
      - name: Aggregate source diagnostic
        continue-on-error: true
        run: timeout 360 lake env lean FormalResearch.lean

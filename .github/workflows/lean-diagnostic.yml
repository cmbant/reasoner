name: Lean module diagnostics

on:
  push:
    branches: [formal-research-lean]
  workflow_dispatch:

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: QI-A chirality
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIA/FourQubitMatrix.lean
      - name: QI-A pairing Gram
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIA/PairingGram.lean
      - name: QI-A printed chirality matrix
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIA/PrintedChiralityMatrix.lean
      - name: finite-field lift
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/Certificates/FiniteField.lean
      - name: QI-B1 apolar pivot
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIB1/ApolarPivot.lean
      - name: QI-B1 apolar triangular rank
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIB1/ApolarTriangularRank.lean
      - name: QI-B2 Hamming gate
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIB2/HammingGate.lean
      - name: QI-B2 Hamming subset expansion
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIB2/HammingSubsetExpansion.lean
      - name: QI-D rank witness
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QID/D5RankWitness.lean
      - name: QI-D Weyl enumeration
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QID/D5WeylEnumeration.lean
      - name: QI-D affine rank
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QID/D5AffineRank.lean
      - name: QI-D active affine simplex
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QID/D5ActiveAffineCertificate.lean
      - name: Gaudin weighted metric
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/Gaudin/WeightedTreeMetric.lean
      - name: Gaudin exponent bookkeeping
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/Gaudin/ExponentBookkeeping.lean
      - name: QI-C finite-field irreducibility
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIC/FiniteFieldIrreducibility.lean
      - name: QI-C Gaussian modular nonvanishing
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIC/GaussianNonvanishing.lean
      - name: QI-C Gaussian integer lift
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIC/GaussianIntegerLift.lean
      - name: QI-C all-L scalar nonvanishing
        continue-on-error: true
        run: timeout 120 lake env lean FormalResearch/QIC/QubitTailAllLNonvanishing.lean
      - name: QI-C tail inverse certificate
        continue-on-error: true
        run: timeout 180 lake env lean FormalResearch/QIC/QubitTailDeterminants.lean
      - name: QI-C endpoint determinant values
        continue-on-error: true
        run: timeout 300 lake env lean FormalResearch/QIC/Endpoint14Evaluation.lean
      - name: Aggregate import
        continue-on-error: true
        run: timeout 240 lake env lean FormalResearch.lean

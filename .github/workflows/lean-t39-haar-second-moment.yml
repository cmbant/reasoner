name: Lean T39 Haar second moment

on:
  push:
    branches:
      - agents/T39-qia-haar-second-moment

concurrency:
  group: lean-t39-haar-second-moment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Build T39 Haar second-moment module
        run: timeout 480 lake build FormalResearch.QIA.SparseWitnessHaarSecondMoment
      - name: Build FormalResearch aggregate
        run: timeout 900 lake build FormalResearch

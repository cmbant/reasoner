name: Lean failure-only frontier

on:
  push:
    branches: [formal-research-lean]
  workflow_dispatch:

concurrency:
  group: lean-frontier-failures-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi

      - name: QI-C qubit-tail determinant
        if: ${{ always() && !cancelled() }}
        run: timeout 300 lake build FormalResearch.QIC.QubitTailDeterminants
      - name: QI-A three-copy binomial bridge
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.QIA.ThreeCopyMemoryBinomialBridge
      - name: QI-B2 Krawtchouk generating
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.QIB2.KrawtchoukGenerating
      - name: QI-A printed chirality matrix
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.QIA.PrintedChiralityMatrix
      - name: QI-C all-L qubit-tail nonvanishing
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.QIC.QubitTailAllLNonvanishing
      - name: Gaudin Bernoulli inverse recurrence
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.Gaudin.BernoulliInverseRecurrence
      - name: Gaudin restricted cross-rank
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.Gaudin.RestrictedCrossRank
      - name: Blaschke product Wronskian
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.Blaschke.ProductWronskian
      - name: Racah Weyl cell telescoping
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.Racah.WeylCellTelescoping
      - name: QI-B2 Hamming Boolean-cube phase
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.QIB2.HammingBooleanCubePhase
      - name: QI-B1 apolar full-rank
        if: ${{ always() && !cancelled() }}
        run: timeout 180 lake build FormalResearch.QIB1.ApolarFullRank

  endpoint14:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: QI-C endpoint-14 numeric Bird experiment
        run: timeout 300 lake build FormalResearch.QIC.Endpoint14NumericBirdExperiment

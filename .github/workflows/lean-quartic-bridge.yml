name: Lean quartic reconstruction bridge

on:
  push:
    branches: [agents/blaschke-quartic-raw-bridge]
  workflow_dispatch:

jobs:
  quartic-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Build quartic reconstruction bridge
        run: timeout 300 lake build FormalResearch.Blaschke.QuarticChargeGapReconstructionBridge
      - name: Build formal research aggregate
        run: timeout 2700 lake build FormalResearch

name: Lean QI-D T48 harmonic block

on:
  push:
    branches: [agents/qid-t48-harmonic-block]
  workflow_dispatch:

jobs:
  qid-t48-harmonic-block:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Build T48 harmonic-block module
        run: timeout 600 lake build FormalResearch.QID.E6F4HarmonicBlockFactorization
      - name: Build full FormalResearch aggregate
        run: timeout 900 lake build FormalResearch

name: Lean QI-A packaged isotypic memory bound

on:
  push:
    branches:
      - 'agents/qia-packaged-isotypic-memory-bound'

concurrency:
  group: lean-qia-packaged-isotypic-memory-bound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Build packaged isotypic memory bound
        run: timeout 600 lake build FormalResearch.QIA.DeferredQueryIsotypicChannelMemoryBound
      - name: Build FormalResearch aggregate
        run: timeout 900 lake build FormalResearch

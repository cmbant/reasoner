name: Endpoint14 identity and aggregate

on:
  push:
    branches: [formal-research-lean]
  workflow_dispatch:

concurrency:
  group: endpoint14-reduced-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[endpoint14-identity]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: QI-C endpoint-14 reduced polynomial identity
        run: timeout 1200 lake build FormalResearch.QIC.Endpoint14ReducedPolynomialIdentity
      - name: QI-C endpoint-14 full determinant bridge
        run: timeout 300 lake build FormalResearch.QIC.Endpoint14PolynomialIdentity FormalResearch.QIC.GaussianEndpointNonsingular FormalResearch.QIC.GaussianEndpointFullRank FormalResearch.QIC.GaussianEndpointInjective FormalResearch.QIC.GaussianEndpointAdjugateReconstruction
      - name: FormalResearch aggregate
        run: timeout 1200 lake build FormalResearch

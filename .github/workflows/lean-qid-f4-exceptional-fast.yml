name: Lean QI-D F4 exceptional fast core

# Exact QIprojects F4 verifier blob: c0c3534128658bb18c5563e1815893e3272fa7e0
on:
  push:
    branches: [agents/qid-f4-exceptional-fast]
  workflow_dispatch:

jobs:
  qid-f4-exceptional-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -R --line-number -E '\bsorry\b|\badmit\b' FormalResearch FormalResearch.lean; then
            echo 'Lean placeholders found'
            exit 1
          fi
      - name: Build optimized F4 finite core
        run: timeout 900 lake build FormalResearch.QID.F4ExceptionalFacetCertificate
